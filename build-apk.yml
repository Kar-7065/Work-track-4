name: Build WorkTrack APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['apk-server-url.txt', '.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Read server link
        run: |
          URL=$(tr -d ' \r\n' < apk-server-url.txt)
          case "$URL" in https://*) ;; *) echo "apk-server-url.txt must contain your https:// link"; exit 1;; esac
          case "$URL" in *PUT-YOUR*) echo "Edit apk-server-url.txt and put your real link"; exit 1;; esac
          echo "SERVER_URL=$URL" >> $GITHUB_ENV
      - name: Create Android project
        run: |
          mkdir -p apkbuild/www && cd apkbuild
          echo '<!doctype html><title>WorkTrack</title>' > www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<JSON
          {"appId":"com.worktrack.app","appName":"WorkTrack","webDir":"www","server":{"url":"$SERVER_URL","cleartext":false}}
          JSON
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<uses-permission android:name="android.permission.CAMERA" />#' $M
          grep -c "RECORD_AUDIO" $M
          npx cap sync android
      - name: Build APK
        run: cd apkbuild/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTrack-APK
          path: apkbuild/android/app/build/outputs/apk/debug/app-debug.apk
